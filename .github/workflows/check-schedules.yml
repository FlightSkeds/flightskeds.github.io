name: Check CNATRA Schedules
on: workflow_dispatch
permissions:
  contents: read
jobs:
  notification-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Send the requested profile test
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os, uuid
          import requests
          from notify_schedules import APP_ID, API, SITE, api

          filters = [{"field": "tag", "key": key, "relation": "=", "value": value}
                     for key, value in (("squadron", "VT-3"), ("last", "BAILEY"), ("first", "LOGAN"))]
          day = datetime.now(ZoneInfo("America/Chicago")).date().isoformat()
          result = api("/notifications", {
              "app_id": APP_ID, "target_channel": "push", "filters": filters,
              "idempotency_key": str(uuid.uuid5(uuid.NAMESPACE_URL, "flightline-private-test-" + os.environ["GITHUB_RUN_ID"])),
              "headings": {"en": "FlightLine — Test Notification"},
              "contents": {"en": "Logan, this is your background push test. Tap to open your VT-3 schedule."},
              "url": SITE + "?squadron=VT-3&date=" + day,
              "ttl": 300,
          })
          if not result.get("id"):
              print("No notification accepted:",result.get("errors", "no matching subscribers"))
              raise SystemExit(1)
          print("OneSignal accepted the targeted notification.", flush=True)
          import time
          time.sleep(8)
          response = requests.get(API + "/notifications/" + result["id"], params={"app_id": APP_ID},
                                  headers={"Authorization": "Key " + os.environ["ONESIGNAL_REST_API_KEY"]}, timeout=25)
          if response.ok:
              stats = response.json()
              print("Provider counts:", {k: stats.get(k) for k in ("successful","failed","errored","received","remaining")})
          PY
