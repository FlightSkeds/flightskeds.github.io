
name: Check CNATRA Schedules

on:
  workflow_dispatch:
    inputs:
      squadron:
        description: "Schedule to check"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - VT-7
          - VT-9
          - VT-21
          - VT-22
          - TW2-FITU
          - VT-27
          - VT-28
          - VT-31
          - VT-35
          - TW4-FITU
          - TW5
          - TW5-FITU
          - TH-73A-HITU
          - VT-2
          - VT-3
          - VT-6
          - HT-8
          - HT-18
          - HT-28
          - TW6-FITU
          - VT-4
          - VT-10
          - VT-86

      schedule_date:
        description: "YYYY-MM-DD; blank for automatic date"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "8-59/10 13-19 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: cnatra-schedule-check
  cancel-in-progress: false

jobs:
  check-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and process schedules
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SQUADRON: ${{ inputs.squadron }}
          SELECTED_DATE: ${{ inputs.schedule_date }}
        run: |
          echo "Trigger: $EVENT_NAME"
          echo "Run time: $(date -u)"

          if [ "$EVENT_NAME" = "schedule" ]; then
            python fetch_schedules.py --squadron all
          elif [ -n "$SELECTED_DATE" ]; then
            python fetch_schedules.py \
              --squadron "$SELECTED_SQUADRON" \
              --date "$SELECTED_DATE"
          else
            python fetch_schedules.py \
              --squadron "$SELECTED_SQUADRON"
          fi

      - name: Commit downloaded schedules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d schedules ]; then
            git add schedules/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update CNATRA schedules"
            git push
          else
            echo "No new schedules to commit"
          fi
