
name: Check CNATRA Schedules

on:
  workflow_dispatch:
    inputs:
      backfill_assignments:
        description: "Reparse the past 30 days of archived PDFs"
        type: boolean
        default: false
      squadron:
        description: "Schedule to check"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - VT-7
          - VT-9
          - VT-21
          - VT-22
          - TW2-FITU
          - VT-27
          - VT-28
          - VT-31
          - VT-35
          - TW4-FITU
          - TW5
          - TW5-FITU
          - TH-73A-HITU
          - VT-2
          - VT-3
          - VT-6
          - HT-8
          - HT-18
          - HT-28
          - TW6-FITU
          - VT-4
          - VT-10
          - VT-86

      schedule_date:
        description: "YYYY-MM-DD; blank for automatic date"
        required: false
        default: ""
        type: string

  # Backup for the existing external dispatcher. Covers 13:08 Central in both seasons.
  schedule:
    - cron: "8,38 0-3,18-23 * * *"

permissions:
  contents: write

concurrency:
  group: cnatra-schedule-check
  cancel-in-progress: false

jobs:
  check-schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show execution details
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
          echo "Central: $(TZ=America/Chicago date)"
          echo "Branch: ${{ github.ref_name }}"

      - name: Download and process schedules
        env:
          SELECTED_SQUADRON: ${{ inputs.squadron }}
          BACKFILL_ASSIGNMENTS: ${{ inputs.backfill_assignments }}
          SELECTED_DATE: ${{ inputs.schedule_date }}
        run: |
          if [ "$BACKFILL_ASSIGNMENTS" = "true" ]; then
            python fetch_schedules.py --backfill-assignments --squadron "${SELECTED_SQUADRON:-all}"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python fetch_schedules.py --scheduled-poll
          elif [ -n "$SELECTED_DATE" ]; then
            python fetch_schedules.py \
              --squadron "${SELECTED_SQUADRON:-all}" \
              --date "$SELECTED_DATE"
          else
            python fetch_schedules.py \
              --squadron "${SELECTED_SQUADRON:-all}"
          fi

      - name: Commit downloaded schedules
        id: archive
        if: success() || (failure() && inputs.backfill_assignments)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f .github/notification-cursor ]; then
            git rev-parse HEAD > .github/notification-cursor
            git add .github/notification-cursor
          fi
          if [ -d schedules ]; then
            git add schedules/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update CNATRA schedules"
            git push
          else
            echo "No new schedules to commit"
          fi

      - name: Send FlightLine notifications
        if: success()
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python notify_schedules.py

      - name: Save notification progress
        if: always() && steps.archive.outcome == 'success'
        run: |
          git add .github/notification-cursor
          if ! git diff --cached --quiet; then
            git commit -m "Record processed schedule revisions"
            git push
          fi
