
name: Set up FlightLine Push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install push integration
        run: python install_push.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add push/OneSignalSDKWorker.js
          git add fetch_schedules.py
          git add .github/workflows/check-schedules.yml

          if ! git diff --cached --quiet; then
            git commit -m "Add personalized FlightLine push notifications"
            git push
          else
            echo "No changes needed"
          fi
